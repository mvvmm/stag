# agent-browser ships its native binaries in the package; its postinstall only re-downloads them.
# esbuild and workerd (via @cloudflare/vite-plugin) check or fetch their platform binary in postinstall.
allowBuilds:
  agent-browser: false
  esbuild: true
  workerd: true
# The cf CLI is a fast-moving beta (bumped every step), and its Cloudflare packages (the Vite
# plugin and the wrangler it depends on) ship daily, newer than the release-age window.
minimumReleaseAgeExclude:
  - cf
  - '@cloudflare/*'
  - wrangler
  - miniflare@5.20261001.0-alpha
